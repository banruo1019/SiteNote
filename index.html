<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SiteNotes</title>
<meta name="description" content="SiteNotes — voice-first construction site logging for iOS. By Banruo Yang, Sydney.">
<style>
  :root {
    --fg: #1d1d1f;
    --fg-dim: #6e6e73;
    --bg: #ffffff;
    --accent: #0066cc;
    --line: #e5e5ea;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --fg: #f5f5f7;
      --fg-dim: #a1a1a6;
      --bg: #000;
      --line: #2c2c2e;
    }
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, system-ui, sans-serif;
    color: var(--fg);
    background: var(--bg);
    margin: 0;
    line-height: 1.6;
    font-size: 17px;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  main {
    max-width: 560px;
    text-align: center;
  }
  h1 {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 12px;
  }
  .tagline {
    font-size: 19px;
    color: var(--fg-dim);
    margin: 0 0 40px;
  }
  nav {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 12px;
    margin-bottom: 32px;
  }
  @media (max-width: 480px) {
    nav { grid-template-columns: 1fr; }
  }
  nav a {
    display: block;
    padding: 16px 20px;
    background: rgba(0, 102, 204, 0.08);
    border-radius: 12px;
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
    transition: background 0.15s;
  }
  nav a:hover {
    background: rgba(0, 102, 204, 0.15);
  }
  footer {
    color: var(--fg-dim);
    font-size: 14px;
  }
  footer a {
    color: var(--fg-dim);
  }
</style>
</head>
<body>
<main>
  <h1>SiteNotes</h1>
  <p class="tagline">Voice-first construction site logging.<br>iPhone-native. Privacy by default.</p>
  <nav>
    <a href="privacy/">Privacy Policy</a>
    <a href="terms/">Terms of Service</a>
    <a href="support/">Support</a>
  </nav>
  <footer>
    <p>© 2026 Banruo Yang · Sydney, NSW, Australia<br><a href="mailto:banruostudio@gmail.com">banruostudio@gmail.com</a></p>
  </footer>
</main>
</body>
</html>
